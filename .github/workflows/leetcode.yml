name: Refresh LeetCode card

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # NeetCode row appears once the LEETCODE_SESSION secret is set; LeetCode totals don't need it
      - run: python scripts/leetcode_render.py assets/leetcode.svg
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
      - name: Commit if changed
        run: |
          git add -N assets/leetcode.json
          git diff --quiet assets/leetcode.svg assets/leetcode.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode.svg assets/leetcode.json
          git commit -m "Refresh LeetCode stats"
          git push
