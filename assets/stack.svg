<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Skills: Python, TypeScript, Go, FastAPI, LangGraph, Angular, PostgreSQL, Redis, Docker, OpenTelemetry">
  <title>Skills</title>
  <defs>
    <style>
      text{font-family:'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace}
      .row{fill:#00e5ff;font-size:11px;letter-spacing:3px}
      .chip{fill:#161b22;stroke:#30363d;stroke-width:1}
      .hot{stroke:#00e5ff;stroke-width:1.5}
      .t{fill:#e6edf3;font-size:13px;text-anchor:middle}
      .c{animation:p 3.6s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.6}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1000" height="150" fill="#0d1117"/>
  <text x="20" y="24" class="row">// SKILLS</text>

  <g transform="translate(20,40)">
    <g><rect class="chip hot c" width="120" height="30" rx="3"/><text class="t" x="60" y="20">Python</text></g>
    <g transform="translate(130,0)"><rect class="chip hot c" width="120" height="30" rx="3"/><text class="t" x="60" y="20">TypeScript</text></g>
    <g transform="translate(260,0)"><rect class="chip hot c" width="80" height="30" rx="3"/><text class="t" x="40" y="20">Go</text></g>
    <g transform="translate(350,0)"><rect class="chip" width="110" height="30" rx="3"/><text class="t" x="55" y="20">FastAPI</text></g>
    <g transform="translate(470,0)"><rect class="chip" width="120" height="30" rx="3"/><text class="t" x="60" y="20">LangGraph</text></g>
    <g transform="translate(600,0)"><rect class="chip" width="110" height="30" rx="3"/><text class="t" x="55" y="20">Angular</text></g>
    <g transform="translate(720,0)"><rect class="chip" width="110" height="30" rx="3"/><text class="t" x="55" y="20">React</text></g>
  </g>
  <g transform="translate(20,80)">
    <g><rect class="chip" width="130" height="30" rx="3"/><text class="t" x="65" y="20">PostgreSQL</text></g>
    <g transform="translate(140,0)"><rect class="chip" width="90" height="30" rx="3"/><text class="t" x="45" y="20">Redis</text></g>
    <g transform="translate(240,0)"><rect class="chip" width="100" height="30" rx="3"/><text class="t" x="50" y="20">Docker</text></g>
    <g transform="translate(350,0)"><rect class="chip" width="130" height="30" rx="3"/><text class="t" x="65" y="20">OpenTelemetry</text></g>
    <g transform="translate(490,0)"><rect class="chip" width="100" height="30" rx="3"/><text class="t" x="50" y="20">Docling</text></g>
    <g transform="translate(600,0)"><rect class="chip" width="110" height="30" rx="3"/><text class="t" x="55" y="20">Prometheus</text></g>
    <g transform="translate(720,0)"><rect class="chip" width="100" height="30" rx="3"/><text class="t" x="50" y="20">GitHub CI</text></g>
  </g>
  <path d="M20 128H980" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="144" fill="#8b949e" font-size="11">hot = daily drivers · others = used in shipped projects</text>
</svg>